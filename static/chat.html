<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanya AI - EasyCorp Social Media Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            surface: { 950: '#0b0d12', 900: '#111318', 850: '#171a21', 800: '#1e222b', 750: '#262b36', border: '#2a2f3a' },
          },
        },
      },
    };
  </script>
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { background-color: #0b0d12; color: #e5e7eb; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 9999px; }
    textarea { field-sizing: content; }
    .conv-item.active { background-color: #1e222b; color: #ffffff; }
    .msg-bubble-user { background-color: #dc2626; color: #ffffff; }
    .msg-bubble-assistant { background-color: #171a21; color: #e5e7eb; border: 1px solid #262b36; }
    .prompt-chip:hover { background-color: #1e222b; border-color: #3a4150; }
  </style>
</head>
<body class="antialiased h-screen flex">

  <!-- Sidebar: Conversations -->
  <aside class="w-72 bg-surface-950 border-r border-surface-border flex flex-col shrink-0 h-full">
    <div class="p-3 border-b border-surface-border">
      <a href="/analytics" class="flex items-center gap-2.5 px-2 py-2 rounded-xl hover:bg-surface-850 transition-colors text-xs font-semibold text-gray-400 hover:text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Dashboard</span>
      </a>
    </div>

    <div class="p-3">
      <button id="new-chat-btn" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl border border-surface-border text-sm font-semibold text-gray-200 hover:bg-surface-850 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span>Percakapan Baru</span>
      </button>
    </div>

    <div class="px-3 pb-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Riwayat Percakapan</div>
    <div id="conversation-list" class="flex-1 overflow-y-auto px-3 pb-3 space-y-1"></div>

    <div class="p-3 border-t border-surface-border">
      <div class="flex items-center gap-2.5 px-2 py-2 rounded-xl">
        <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-extrabold text-white text-xs shrink-0">EC</div>
        <div class="flex flex-col truncate">
          <span class="text-xs font-bold text-gray-200 truncate">EasyCorp Social AI</span>
          <span class="text-[10px] text-gray-500 truncate">Claude Tool-Use Agent</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col h-full bg-surface-900 min-w-0">

    <!-- Header -->
    <header class="h-14 border-b border-surface-border flex items-center justify-between px-5 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <span id="conversation-title" class="font-bold text-sm text-gray-100 truncate">Percakapan Baru</span>
      </div>
      <div class="flex items-center gap-2 text-[11px] font-semibold text-gray-500">
        <span class="px-2 py-1 rounded-lg bg-surface-850 border border-surface-border">social-media-claude-agent</span>
      </div>
    </header>

    <!-- Messages -->
    <div id="chat-messages" class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6"></div>

    <!-- Composer -->
    <div class="border-t border-surface-border p-4 shrink-0">
      <form id="chat-form" class="max-w-3xl mx-auto w-full">
        <div class="relative bg-surface-850 rounded-2xl border border-surface-border focus-within:border-red-500 transition-colors shadow-lg">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Tanyakan sesuatu tentang performa media sosial EasyCorp..."
            class="w-full bg-transparent text-gray-100 placeholder-gray-500 text-sm px-4 py-3.5 pr-14 focus:outline-none resize-none max-h-40"
          ></textarea>
          <button type="submit" id="send-btn" class="absolute right-2.5 bottom-2.5 w-9 h-9 rounded-xl bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          </button>
        </div>
        <p class="text-center text-[11px] text-gray-600 mt-2">AI dapat membuat kesalahan. Verifikasi angka penting lewat dashboard analitik.</p>
      </form>
    </div>
  </main>

  <script>
    const CHAT_ACTION_API_KEY = "__CHAT_ACTION_API_KEY__";
    const STORAGE_KEY = "easycorp_chat_conversations";

    let conversations = loadConversations();
    let activeConversationId = null;

    function loadConversations() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveConversations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    }

    function createConversation() {
      const conv = { id: `conv_${Date.now()}`, title: "Percakapan Baru", messages: [], createdAt: Date.now() };
      conversations.unshift(conv);
      saveConversations();
      return conv;
    }

    function getActiveConversation() {
      return conversations.find((c) => c.id === activeConversationId) || null;
    }

    function renderConversationList() {
      const list = document.getElementById('conversation-list');
      if (conversations.length === 0) {
        list.innerHTML = '<div class="px-2 py-4 text-xs text-gray-600 text-center">Belum ada riwayat percakapan.</div>';
        return;
      }
      list.innerHTML = conversations
        .map((c) => `
          <button class="conv-item w-full text-left px-3 py-2 rounded-xl text-xs font-medium text-gray-400 hover:bg-surface-850 hover:text-white transition-colors truncate flex items-center gap-2 ${c.id === activeConversationId ? 'active' : ''}" data-conv-id="${c.id}">
            <svg class="w-3.5 h-3.5 shrink-0 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <span class="truncate">${escapeHtml(c.title)}</span>
          </button>
        `)
        .join('');

      list.querySelectorAll('.conv-item').forEach((btn) => {
        btn.addEventListener('click', () => switchConversation(btn.dataset.convId));
      });
    }

    function switchConversation(id) {
      activeConversationId = id;
      renderConversationList();
      renderMessages();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function getEmptyStateHtml() {
      return `
        <div id="empty-state" class="max-w-2xl mx-auto w-full flex flex-col items-center text-center gap-4 mt-12">
          <div class="w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center font-extrabold text-white text-xl shadow-lg">EC</div>
          <div>
            <h1 class="text-xl font-bold text-white">Tanya AI EasyCorp</h1>
            <p class="text-sm text-gray-400 mt-1.5 max-w-md">Analisis performa @id.easylegal, @id.easytax, @id.easyoffice, benchmark kompetitor, atau minta aksi seperti "scrape akun X" langsung dari sini.</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full mt-4">
            <button class="prompt-chip text-left px-4 py-3 rounded-xl border border-surface-border bg-surface-850 text-xs text-gray-300 transition-colors" data-prompt="Bandingkan performa akun @id.easylegal vs kompetitor bulan ini">
              Bandingkan performa @id.easylegal vs kompetitor bulan ini
            </button>
            <button class="prompt-chip text-left px-4 py-3 rounded-xl border border-surface-border bg-surface-850 text-xs text-gray-300 transition-colors" data-prompt="Berikan ide konten untuk EasyTax minggu ini berdasarkan tren pajak terbaru">
              Ide konten EasyTax berdasarkan tren pajak terbaru
            </button>
            <button class="prompt-chip text-left px-4 py-3 rounded-xl border border-surface-border bg-surface-850 text-xs text-gray-300 transition-colors" data-prompt="Konten apa yang paling viral di TikTok untuk topik pendirian PT?">
              Konten paling viral untuk topik pendirian PT di TikTok
            </button>
            <button class="prompt-chip text-left px-4 py-3 rounded-xl border border-surface-border bg-surface-850 text-xs text-gray-300 transition-colors" data-prompt="Scrape ulang data terbaru akun @id.easyoffice">
              Scrape ulang data terbaru akun @id.easyoffice
            </button>
          </div>
        </div>
      `;
    }

    function attachPromptChipListeners() {
      document.querySelectorAll('.prompt-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          sendMessage(chip.dataset.prompt);
        });
      });
    }

    function renderMessages() {
      const container = document.getElementById('chat-messages');
      const conv = getActiveConversation();
      const titleEl = document.getElementById('conversation-title');

      if (!conv || conv.messages.length === 0) {
        container.innerHTML = getEmptyStateHtml();
        attachPromptChipListeners();
        titleEl.textContent = 'Percakapan Baru';
        return;
      }

      titleEl.textContent = conv.title;
      container.innerHTML = conv.messages
        .map((m) => renderMessageBubble(m.role, m.content))
        .join('');
      container.scrollTop = container.scrollHeight;
    }

    function renderMessageBubble(role, text) {
      const safeText = escapeHtml(text).replace(/\n/g, '<br/>');
      if (role === 'user') {
        return `
          <div class="flex max-w-3xl mx-auto w-full gap-3 justify-end">
            <div class="msg-bubble-user px-4 py-3 rounded-2xl rounded-tr-sm text-sm leading-relaxed shadow-sm max-w-[75%]">${safeText}</div>
          </div>
        `;
      }
      return `
        <div class="flex max-w-3xl mx-auto w-full gap-3 items-start">
          <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-extrabold text-white text-xs shrink-0 mt-0.5">EC</div>
          <div class="msg-bubble-assistant px-4 py-3 rounded-2xl rounded-tl-sm text-sm leading-relaxed shadow-sm max-w-[75%] whitespace-pre-wrap">${safeText}</div>
        </div>
      `;
    }

    function appendLiveBubble(role, text) {
      const container = document.getElementById('chat-messages');
      const emptyState = document.getElementById('empty-state');
      if (emptyState) {
        container.innerHTML = '';
      }
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderMessageBubble(role, text).trim();
      const node = wrapper.firstChild;
      container.appendChild(node);
      container.scrollTop = container.scrollHeight;
      return node.querySelector('.msg-bubble-user, .msg-bubble-assistant');
    }

    async function sendMessage(text) {
      let conv = getActiveConversation();
      if (!conv) {
        conv = createConversation();
        activeConversationId = conv.id;
        renderConversationList();
      }

      conv.messages.push({ role: 'user', content: text });
      if (conv.title === 'Percakapan Baru') {
        conv.title = text.length > 42 ? text.slice(0, 42) + '...' : text;
      }
      saveConversations();
      renderConversationList();

      appendLiveBubble('user', text);
      document.getElementById('conversation-title').textContent = conv.title;
      const loadingBubble = appendLiveBubble('assistant', 'Sedang menganalisis...');

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      try {
        const headers = { 'Content-Type': 'application/json' };
        if (CHAT_ACTION_API_KEY && !CHAT_ACTION_API_KEY.startsWith('__')) {
          headers['X-API-Key'] = CHAT_ACTION_API_KEY;
        }
        const res = await fetch('/chat', {
          method: 'POST',
          headers,
          body: JSON.stringify({ message: text, messages: conv.messages }),
        });
        const data = await res.json();
        const reply = data.reply || data.message || 'Maaf, tidak ada jawaban yang bisa ditampilkan.';
        loadingBubble.innerHTML = escapeHtml(reply).replace(/\n/g, '<br/>');
        conv.messages.push({ role: 'assistant', content: reply });
        saveConversations();
      } catch (err) {
        loadingBubble.textContent = 'Gagal menghubungi AI: ' + err.message;
      } finally {
        sendBtn.disabled = false;
      }
    }

    function initListeners() {
      document.getElementById('new-chat-btn').addEventListener('click', () => {
        activeConversationId = null;
        renderConversationList();
        renderMessages();
        document.getElementById('chat-input').focus();
      });

      document.getElementById('chat-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.style.height = 'auto';
        sendMessage(text);
      });

      const input = document.getElementById('chat-input');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          document.getElementById('chat-form').requestSubmit();
        }
      });
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderConversationList();
      renderMessages();
      initListeners();
    });
  </script>
</body>
</html>
