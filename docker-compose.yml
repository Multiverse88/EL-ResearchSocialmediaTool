services:
  # Backend REST API, Scrapers, AI Chat (embedded in the dashboard), and Analytics Dashboard
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easycorp_social_api
    restart: unless-stopped
    # Headless Chromium (TikTokApi/Playwright free scraping path) needs more than Docker's
    # default 64MB /dev/shm or it crashes intermittently under load.
    shm_size: '1gb'
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://router9-9router-bba7ab-157-10-252-77.sslip.io/v1}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://router9-9router-bba7ab-157-10-252-77.sslip.io/v1}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-Thinking}
      - DATABASE_PATH=/app/data/social_media.db
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME:-}
      - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD:-}
      - INSTAGRAM_SESSION_FILE=${INSTAGRAM_SESSION_FILE:-}
      - TIKTOK_MS_TOKEN=${TIKTOK_MS_TOKEN:-}
      - TIKTOK_SESSION_COOKIE=${TIKTOK_SESSION_COOKIE:-}
      - BRIGHT_DATA_API_TOKEN=${BRIGHT_DATA_API_TOKEN:-}
      - BRIGHT_DATA_SERP_ZONE=${BRIGHT_DATA_SERP_ZONE:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - CHAT_ACTION_API_KEY=${CHAT_ACTION_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - CHAT_RATE_LIMIT_PER_MINUTE=${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      - MAX_POSTS_PER_SCRAPE=${MAX_POSTS_PER_SCRAPE:-30}
      - ENABLE_LIVE_SCRAPE_ON_CHAT=${ENABLE_LIVE_SCRAPE_ON_CHAT:-true}
      - TOPIC_STALENESS_HOURS=${TOPIC_STALENESS_HOURS:-24}
      - ENABLE_DAILY_SYNC_SCHEDULER=${ENABLE_DAILY_SYNC_SCHEDULER:-true}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - easycorp_network

volumes:
  app-data:
    name: easycorp_social_app_data

networks:
  easycorp_network:
    name: easycorp_social_network
